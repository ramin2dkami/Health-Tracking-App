<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
    <title>Health Diary Mockup</title>
    <style>
      :root {
        --bg: #e9e3d6;
        --ink: #141414;
        --muted: #7a7466;
        --bezel: #141414;
        --screen-bg: #f5efe2;
        --chip: rgba(20, 20, 20, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1b19;
          --ink: #f3efe6;
          --muted: #a39d90;
          --bezel: #000;
          --chip: rgba(255, 255, 255, 0.08);
        }
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: 'DM Sans', system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 8px;
        padding: 14px 16px 0;
      }
      .toolbar button, .toolbar a {
        border: none;
        background: var(--chip);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        padding: 7px 14px;
        border-radius: 999px;
        cursor: pointer;
        text-decoration: none;
      }
      .toolbar button.is-selected { background: var(--ink); color: var(--bg); }
      .toolbar .sep { width: 1px; height: 20px; background: var(--chip); margin: 0 4px; }
      .stage {
        flex: 1;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 0;
      }
      .phone {
        position: relative;
        padding: 12px;
        background: var(--bezel);
        border-radius: 58px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25), inset 0 0 0 2px #2c2c2c;
        transform-origin: center center;
        flex-shrink: 0;
      }
      .screen {
        position: relative;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-radius: 46px;
        background: var(--screen-bg);
      }
      .phone.is-small { border-radius: 40px; }
      .phone.is-small .screen { border-radius: 28px; }
      .statusbar {
        height: 50px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 32px 0 36px;
        font-size: 15px;
        font-weight: 700;
        color: #141414;
        background: var(--screen-bg);
      }
      .phone.is-small .statusbar { height: 22px; padding: 0 12px; font-size: 12px; }
      .island {
        position: absolute;
        top: 11px;
        left: 50%;
        transform: translateX(-50%);
        width: 122px;
        height: 34px;
        border-radius: 20px;
        background: #000;
      }
      .phone.is-small .island { display: none; }
      .icons { display: flex; gap: 6px; align-items: center; }
      .icons svg { display: block; }
      iframe { flex: 1; width: 100%; border: 0; background: var(--screen-bg); }
      .home-bar {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 134px;
        height: 5px;
        border-radius: 3px;
        background: #141414;
        opacity: 0.85;
        pointer-events: none;
      }
      .phone.is-small .home-bar { display: none; }
      .caption { color: var(--muted); font-size: 12px; padding: 0 16px 12px; text-align: center; }
    </style>
  </head>
  <body>
    <div class="toolbar" role="toolbar" aria-label="Device">
      <button type="button" data-device="se">iPhone SE</button>
      <button type="button" data-device="iphone" class="is-selected">iPhone 15</button>
      <button type="button" data-device="pixel">Pixel 8</button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" id="reload">Reload</button>
      <a href="/" target="_blank" rel="noopener">Open app ↗</a>
    </div>

    <div class="stage">
      <div class="phone" id="phone">
        <div class="screen" id="screen">
          <div class="statusbar">
            <span id="clock">9:41</span>
            <span class="icons" aria-hidden="true">
              <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
              <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><rect x="23" y="4" width="1.5" height="4" rx="0.75" fill="currentColor" opacity="0.4"/></svg>
            </span>
          </div>
          <div class="island" aria-hidden="true"></div>
          <iframe id="app" src="/" title="Health Diary app"></iframe>
          <div class="home-bar" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <p class="caption">Live dev build — edits hot-reload here. Data is the same as when you open the app directly.</p>

    <script>
      const devices = {
        se: { w: 375, h: 667, small: true },
        iphone: { w: 390, h: 844, small: false },
        pixel: { w: 412, h: 915, small: false },
      };
      const phone = document.getElementById('phone');
      const screen = document.getElementById('screen');
      const iframe = document.getElementById('app');
      let current = 'iphone';

      function fit() {
        const d = devices[current];
        const stage = document.querySelector('.stage');
        const totalW = d.w + 24;
        const totalH = d.h + 24;
        const scale = Math.min(1, (stage.clientHeight - 24) / totalH, (stage.clientWidth - 32) / totalW);
        phone.style.transform = `scale(${scale})`;
        phone.style.margin = `${(totalH * (scale - 1)) / 2}px ${(totalW * (scale - 1)) / 2}px`;
      }

      function setDevice(name) {
        current = name;
        const d = devices[name];
        screen.style.width = d.w + 'px';
        screen.style.height = d.h + 'px';
        phone.classList.toggle('is-small', d.small);
        document.querySelectorAll('[data-device]').forEach((b) => {
          b.classList.toggle('is-selected', b.dataset.device === name);
          b.setAttribute('aria-pressed', String(b.dataset.device === name));
        });
        try { localStorage.setItem('mockup-device', name); } catch {}
        fit();
      }

      document.querySelectorAll('[data-device]').forEach((b) =>
        b.addEventListener('click', () => setDevice(b.dataset.device)),
      );
      document.getElementById('reload').addEventListener('click', () => iframe.contentWindow.location.reload());
      window.addEventListener('resize', fit);

      function tick() {
        document.getElementById('clock').textContent = new Date()
          .toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
          .replace(/\s?[AP]M$/i, '');
      }
      tick();
      setInterval(tick, 15000);

      let saved = 'iphone';
      try { saved = localStorage.getItem('mockup-device') || 'iphone'; } catch {}
      setDevice(devices[saved] ? saved : 'iphone');
    </script>
  </body>
</html>
